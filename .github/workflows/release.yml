name: Publish mod release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Publish the tested install package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(jq -er '.version' src/FriendSpire/FriendSpire.json)
          archive="src/dist/SweetCorn-$version.zip"
          unzip -tq "$archive"
          unzip -p "$archive" FriendSpire/FriendSpire.json | cmp - src/FriendSpire/FriendSpire.json
          gh release create "$GITHUB_REF_NAME" "$archive" \
            --verify-tag --notes-from-tag --title "甜玉米 $GITHUB_REF_NAME"
